<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Jewellery — Gem Experience</title>
<meta name="description" content="Singular pieces, each cut from a stone we followed out of the ground.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="shell">

    <header class="hdr">
      <div class="hdr-side">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Open menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
      </div>

      <a class="hdr-brand" href="#/">Gem Experience</a>

      <div class="hdr-side hdr-side--end">
        <button class="icon-btn" type="button" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 21 21"></path>
          </svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
          </svg>
        </button>
        <button class="icon-btn" type="button" aria-label="Shopping bag">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <path d="M5 8h14l-1.2 12H6.2L5 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="view"></main>

    <footer class="ftr">
      <span class="ftr-brand">Gem Experience</span>
      <div class="ftr-cols">
        <div class="ftr-col">
          <span class="ftr-col-title">Jewellery</span>
          <a href="#/">High Jewellery</a>
          <a href="#/">Fine Jewellery</a>
          <a href="#/">Gifts</a>
        </div>
        <div class="ftr-col">
          <span class="ftr-col-title">Client care</span>
          <a href="#/">Private viewings</a>
          <a href="#/">Enquiries</a>
          <a href="#/">Provenance</a>
        </div>
      </div>
    </footer>

  </div>
</div>

<div id="drawer-host"></div>

<script src="app.js"></script>
</body>
</html>
