# SEO and security fixes for /etc/nginx/sites-available/gem-experience
# (found in the 2026-11-23 SEO audit). Apply on the VPS, then
#   nginx -t && systemctl reload nginx
#
# 1. The security headers in snippets/gem-performance.conf never reach a page.
#    nginx drops server-level add_header lines inside any location that sets
#    its own, and every location here does (Cache-Control). So the headers go
#    in a snippet that each location includes:
#
#    /etc/nginx/snippets/gem-security-headers.conf
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#
#    then add   include snippets/gem-security-headers.conf;
#    inside   location /, location /admin/, the /blog/ location and the
#    image location of the 443 server block.
#
# 2. http://www.gem-experience.com takes two hops (http www -> https www ->
#    https apex). In the port-80 server block, send www straight to the apex:
#
#        if ($host = www.gem-experience.com) {
#            return 301 https://gem-experience.com$request_uri;
#        }
#
# 3. The sitemap (178 KB of XML) and llms-full.txt go out uncompressed:
#
#        gzip_types text/css application/javascript application/json image/svg+xml
#                   text/plain application/xml text/xml;
