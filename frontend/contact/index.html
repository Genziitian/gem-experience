<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us — Gem Experience</title>
<meta name="description" content="Contact Gem Experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/site-nav.css">
</head>
<body class="pg">
<div class="pg-wrap">
  <div id="pg-header"></div>

  <header class="pg-hero">
    <span class="pg-kicker">Client services</span>
    <h1 class="pg-title">Contact us</h1>
    <p class="pg-lede">Ask about a stone, a commission, or a viewing in private. We reply personally.</p>
  </header>

  <main class="pg-main">
    <div class="enq">
      <form class="pg-form enq-form" id="contact-form">
        <p class="pg-toast" id="toast" hidden></p>

        <div class="pg-row-2">
          <label>Full name<input name="name" required autocomplete="name"></label>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
        </div>

        <label>Subject
          <select name="subject" required>
            <option value="">Select</option>
            <option>General enquiry</option>
            <option>High Jewellery</option>
            <option>Commission</option>
            <option>Aftercare</option>
            <option>Press</option>
          </select>
        </label>

        <label>Message
          <textarea name="message" rows="5" required placeholder="Tell us what you need…"></textarea>
        </label>

        <div class="enq-actions">
          <button class="pg-btn" type="submit">Send message</button>
        </div>
      </form>

      <aside class="enq-aside" aria-label="Other ways to reach us">
        <p class="enq-aside-kicker">Or write directly</p>
        <ul class="enq-lines" id="contact-lines">
          <li>
            <span>India</span>
            <a href="https://wa.me/917300043093" target="_blank" rel="noopener noreferrer">+91 73000 43093</a>
          </li>
          <li>
            <span>United Arab Emirates</span>
            <a href="https://wa.me/971588651095" target="_blank" rel="noopener noreferrer">+971 58 865 1095</a>
          </li>
          <li>
            <span>Email</span>
            <a href="mailto:contact@gem-experience.com">contact@gem-experience.com</a>
          </li>
        </ul>
        <nav class="enq-links">
          <a class="pg-link" href="../appointment/">Book an appointment</a>
          <a class="pg-link" href="../offices/">Our offices</a>
        </nav>
      </aside>
    </div>
  </main>

  <div id="pg-footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/gem.js"></script>
<script src="../js/site-footer.js"></script>
<script src="../js/site-content.js"></script>
<script src="../js/site-nav.js"></script>
<script src="../js/shell.js"></script>
<script>
GemShell.mount();

/* The list in the markup above is the fallback and is what renders first.
   Staff edit these in the admin, so replace it only when edited values come
   back — a failed request leaves the page exactly as it shipped. */
if (window.GemContent) {
  window.GemContent.get(function (data) {
    var c = data && data.contact;
    if (!c || !Array.isArray(c.lines) || !c.lines.length) return;
    var ul = document.getElementById("contact-lines");
    if (!ul) return;

    function esc(v) {
      return String(v == null ? "" : v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    var rows = c.lines.map(function (l) {
      /* An external link opens in a new tab; a tel: or mailto: must not, and
         rel=noopener is only meaningful on the former. */
      var href = l.href || "";
      var external = /^https?:/i.test(href);
      var link = href
        ? '<a href="' + esc(href) + '"' +
          (external ? ' target="_blank" rel="noopener noreferrer"' : "") + ">" + esc(l.value) + "</a>"
        : "<span>" + esc(l.value) + "</span>";
      return "<li><span>" + esc(l.region) + "</span>" + link + "</li>";
    });

    if (c.email) {
      rows.push("<li><span>Email</span><a href=\"mailto:" + esc(c.email) + "\">" + esc(c.email) + "</a></li>");
    }
    ul.innerHTML = rows.join("");
  });
}
document.getElementById("contact-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  var f = e.target;
  var btn = f.querySelector("[type=submit]");
  var toast = document.getElementById("toast");
  btn.disabled = true;
  try {
    await Gem.submitForm("contact", {
      name: f.name.value.trim(),
      email: f.email.value.trim(),
      subject: f.subject.value,
      message: f.message.value.trim()
    });
    GemShell.toast(toast, "Message sent. We will reply shortly.", true);
    f.reset();
  } catch (err) {
    GemShell.toast(toast, err.message || "Could not send. Please try again.", false);
  } finally {
    btn.disabled = false;
  }
});
</script>
<script src="../js/analytics.js" defer></script>
</body>
</html>
