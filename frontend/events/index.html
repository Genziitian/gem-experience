<script>
GemShell.mount();

(function () {
  var upcomingEl = document.getElementById("events-upcoming");
  var pastEl = document.getElementById("events-past");
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July",
    "August", "September", "October", "November", "December"];
  var WA_ICON = '<svg class="wa-ico" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>';

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* Dates arrive as YYYY-MM-DD and are read as written: going through Date
     would shift them a day for anybody west of UTC. */
  function parts(ymd) {
    var p = String(ymd).split("-");
    return { y: +p[0], m: +p[1] - 1, d: +p[2] };
  }
  function when(e) {
    var a = parts(e.starts_on);
    if (!e.ends_on || e.ends_on === e.starts_on) return a.d + " " + MONTHS[a.m] + " " + a.y;
    var b = parts(e.ends_on);
    if (a.y === b.y && a.m === b.m) return a.d + " – " + b.d + " " + MONTHS[b.m] + " " + b.y;
    if (a.y === b.y) return a.d + " " + MONTHS[a.m] + " – " + b.d + " " + MONTHS[b.m] + " " + b.y;
    return a.d + " " + MONTHS[a.m] + " " + a.y + " – " + b.d + " " + MONTHS[b.m] + " " + b.y;
  }
  function where(e) {
    return [e.venue, e.city, e.country].filter(Boolean).join(", ");
  }
  function today() {
    var t = new Date();
    return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  }

  function waFor(e) {
    return Gem.whatsappUrl([
      "Hello Gem Experience, I would like details about *" + e.title + "*.",
      when(e) + (where(e) ? ", " + where(e) : ""),
      "",
      "Sent from " + location.origin + "/events/"
    ]);
  }

  function card(e) {
    return '<article class="ev-card">' +
      (e.image ? '<div class="ev-shot"><img src="' + esc(e.image) + '" alt="' + esc(e.title) + '" loading="lazy" decoding="async"></div>' : "") +
      '<div class="ev-body">' +
        '<span class="ev-kind">' + esc(e.kind || "Exhibition") + "</span>" +
        '<h3 class="ev-title">' + esc(e.title) + "</h3>" +
        '<p class="ev-when"><time datetime="' + esc(e.starts_on) + '">' + esc(when(e)) + "</time>" +
          (e.hours ? '<span class="ev-hours">' + esc(e.hours) + "</span>" : "") + "</p>" +
        (where(e) ? '<p class="ev-where">' + esc(where(e)) + "</p>" : "") +
        (e.address ? '<p class="ev-addr">' + esc(e.address) + "</p>" : "") +
        (e.description ? e.description.split(/\n{2,}/).map(function (para) {
          return '<p class="ev-desc">' + esc(para) + "</p>";
        }).join("") : "") +
        '<div class="ev-actions">' +
          '<a class="pg-btn pg-btn--wa" href="' + esc(waFor(e)) + '" target="_blank" rel="noopener noreferrer">' +
            WA_ICON + "<span>WhatsApp for details</span></a>" +
        "</div>" +
      "</div>" +
    "</article>";
  }

  function empty() {
    var href = Gem.whatsappUrl([
      "Hello Gem Experience, please let me know about your upcoming events and exhibitions.",
      "",
      "Sent from " + location.origin + "/events/"
    ]);
    return '<div class="ev-empty">' +
      '<p class="pg-lede">New dates are announced here first. Message us on WhatsApp and we will tell you when the next exhibition is set.</p>' +
      '<a class="pg-btn pg-btn--wa" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
        WA_ICON + "<span>WhatsApp us</span></a>" +
    "</div>";
  }

  function draw(rows) {
    var now = today();
    var upcoming = rows.filter(function (e) { return (e.ends_on || e.starts_on) >= now; });
    var past = rows.filter(function (e) { return (e.ends_on || e.starts_on) < now; }).reverse().slice(0, 8);

    upcomingEl.innerHTML = upcoming.length ? upcoming.map(card).join("") : empty();
    document.getElementById("ev-past").hidden = !past.length;
    pastEl.innerHTML = past.map(function (e) {
      return "<li><strong>" + esc(e.title) + "</strong><span>" + esc(when(e)) +
        (where(e) ? " · " + esc(where(e)) : "") + "</span></li>";
    }).join("");
  }

  /* What tools/build-seo.mjs wrote into the page stays until the live list
     arrives, so a failed request leaves the page as it shipped. */
  var sb = Gem.getClient();
  if (!sb) return;
  sb.from("events")
    .select("title,kind,starts_on,ends_on,hours,venue,city,country,address,description,image")
    .eq("published", true)
    .order("starts_on", { ascending: true })
    .then(function (res) {
      if (res.error) return;
      draw(res.data || []);
    });

  /* With nothing pre-rendered (a fresh page, or no events at build time) the
     list would sit blank while the request runs, so show the invitation. */
  if (!upcomingEl.children.length) draw([]);
})();
</script>
