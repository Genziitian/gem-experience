<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Gem Experience</title>
<meta name="description" content="Sign in to your Gem Experience account to follow enquiries and selections.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/site-nav.css">
<link rel="stylesheet" href="../css/mini-cart.css">
<link rel="stylesheet" href="../css/gift-note.css" media="print" onload="this.media='all'">
<!-- seo -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex, follow">
<meta property="og:site_name" content="Gem Experience">
<meta property="og:type" content="website">
<meta property="og:title" content="Sign in">
<meta property="og:description" content="Sign in to your Gem Experience account to follow enquiries and selections.">
<meta property="og:url" content="https://gem-experience.com/login/">
<meta property="og:image" content="https://gem-experience.com/img/home-hero-wide.webp">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sign in">
<meta name="twitter:description" content="Sign in to your Gem Experience account to follow enquiries and selections.">
<meta name="twitter:image" content="https://gem-experience.com/img/home-hero-wide.webp">
<link rel="alternate" type="text/plain" title="LLM summary" href="https://gem-experience.com/llms.txt">
<!-- /seo -->
</head>
<body class="pg">
<div class="pg-wrap">
  <div id="pg-header"></div>

  <main class="auth">
    <aside class="auth-media" role="img" aria-label="Aquamarine and diamond high jewellery worn against black.">
      <div class="auth-media-copy">
        <span class="pg-kicker">Gem Experience</span>
        <p class="auth-media-line">Nothing begins above ground</p>
      </div>
    </aside>

    <section class="auth-panel">
      <div class="auth-card">
        <span class="pg-kicker">Client account</span>
        <h1 class="pg-title" id="page-title">Sign in</h1>
        <p class="pg-lede" id="page-lede">Follow your orders, quotations, appointments and wishlist in one place.</p>

        <p class="pg-toast" id="toast" hidden></p>

        <div id="google-wrap">
          <button class="auth-google" type="button" id="google-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62Z"></path>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.03-3.71H.96v2.34A9 9 0 0 0 9 18Z"></path>
              <path fill="#FBBC05" d="M3.97 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3.01-2.33Z"></path>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.67 5.16 6.66 3.58 9 3.58Z"></path>
            </svg>
            <span>Continue with Google</span>
          </button>
          <div class="auth-or"><span>or</span></div>
        </div>

        <!-- 1. Email → a six-digit code. The default way in; it also opens an
             account for a first-time visitor. -->
        <form class="pg-form auth-form" id="f-email" data-panel>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <button class="pg-btn" type="submit">Email me a sign-in code</button>
          <p class="auth-alt"><button type="button" data-go="password">Sign in with a password instead</button></p>
        </form>

        <!-- 2. The code, for sign-in, a new account or a password reset. -->
        <form class="pg-form auth-form" id="f-code" data-panel hidden>
          <label>Six-digit code
            <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="000000">
          </label>
          <div id="newpass-fields" hidden>
            <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8"></label>
            <label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" minlength="8"></label>
          </div>
          <button class="pg-btn" type="submit" id="code-submit">Continue</button>
          <p class="auth-alt">
            <button type="button" id="resend-btn">Send a new code</button>
            <span aria-hidden="true">·</span>
            <button type="button" data-go="email">Use another email</button>
          </p>
        </form>

        <!-- 3. Email and password. -->
        <form class="pg-form auth-form" id="f-password" data-panel hidden>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label>Password<input name="password" type="password" required autocomplete="current-password" minlength="6"></label>
          <button class="pg-btn" type="submit">Sign in</button>
          <p class="auth-alt">
            <button type="button" data-go="email">Email me a code instead</button>
            <span aria-hidden="true">·</span>
            <button type="button" data-go="forgot">Forgot password?</button>
          </p>
        </form>

        <!-- 4. A new account with a password; confirmed with a code. -->
        <form class="pg-form auth-form" id="f-signup" data-panel hidden>
          <label>Full name<input name="name" autocomplete="name" required></label>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label>Password<input name="password" type="password" required autocomplete="new-password" minlength="8"></label>
          <button class="pg-btn" type="submit">Create account</button>
          <p class="auth-alt"><button type="button" data-go="email">Sign in instead</button></p>
        </form>

        <!-- 5. Forgotten password: a code to set a new one. -->
        <form class="pg-form auth-form" id="f-forgot" data-panel hidden>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <button class="pg-btn" type="submit">Email me a reset code</button>
          <p class="auth-alt"><button type="button" data-go="password">Back to sign in</button></p>
        </form>

        <!-- 6. Arrived signed in from an older reset link: choose the password. -->
        <form class="pg-form auth-form" id="f-newpass" data-panel hidden>
          <label>New password<input name="password" type="password" required autocomplete="new-password" minlength="8"></label>
          <label>Confirm new password<input name="confirm" type="password" required autocomplete="new-password" minlength="8"></label>
          <button class="pg-btn" type="submit">Save new password</button>
        </form>

        <p class="pg-auth-switch" id="switch-line">
          New here? <button type="button" data-go="signup">Create an account</button>
        </p>

        <p class="auth-fine">
          By continuing you agree to our <a href="../legal/#terms">Terms</a> and
          <a href="../legal/#privacy">Privacy Policy</a>.
        </p>
      </div>
    </section>
  </main>
  <div id="pg-footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/gem.js"></script>
<script src="../js/site-footer.js"></script>
<script src="../js/site-content.js"></script>
<script src="../js/site-nav.js"></script>
<script src="../js/mini-cart.js"></script>
<script src="../js/gift-note.js"></script>
<script src="../js/shell.js"></script>
<script>
GemShell.mount();

/* Where to land afterwards: the page the visitor came from, exactly as it
   was (the piece, the filter, the tab). Only a path on this site is
   accepted, so the parameter cannot send anyone elsewhere. */
var next = (function () {
  var n = GemShell.qs("next") || "";
  return /^\/(?!\/)/.test(n) ? n : "/account/";
})();
var reason = GemShell.qs("reason");

var title = document.getElementById("page-title");
var lede = document.getElementById("page-lede");
var toast = document.getElementById("toast");
var googleWrap = document.getElementById("google-wrap");
var switchLine = document.getElementById("switch-line");
var panels = {};
document.querySelectorAll("[data-panel]").forEach(function (f) { panels[f.id.slice(2)] = f; });

var COPY = {
  email: ["Sign in", "We will email you a six-digit code. No password needed, and it opens an account if you are new."],
  password: ["Sign in", "Sign in with your email and password."],
  signup: ["Create account", "An account keeps your wishlist, selections and enquiries close to the atelier."],
  forgot: ["Reset your password", "Enter your email and we will send you a code to choose a new password."],
  newpass: ["Choose a new password", "Set the password you will use from now on."]
};
if (reason === "wishlist") COPY.email[1] = "Sign in to save this piece to your wishlist. We will bring you straight back to it.";

/* What the code panel is confirming, and for which address. */
var pending = { kind: "", email: "" };

function show(which, heading, line) {
  Object.keys(panels).forEach(function (k) { panels[k].hidden = k !== which; });
  var front = which === "email" || which === "password" || which === "signup";
  googleWrap.hidden = !front;
  switchLine.hidden = which !== "email" && which !== "password";
  toast.hidden = true;
  var c = COPY[which] || [];
  title.textContent = heading || c[0] || "Sign in";
  lede.textContent = line || c[1] || "";
  var first = panels[which].querySelector("input");
  if (first && which !== "email") setTimeout(function () { first.focus(); }, 0);
}

function say(msg, ok) { GemShell.toast(toast, msg, ok); }
function done() { location.href = next; }

/* Carry a typed email from one panel to the next. */
function emailNow() {
  var v = "";
  Object.keys(panels).forEach(function (k) {
    var i = panels[k].querySelector("input[type=email]");
    if (!panels[k].hidden && i && i.value.trim()) v = i.value.trim();
  });
  return v || pending.email;
}

document.querySelectorAll("[data-go]").forEach(function (b) {
  b.addEventListener("click", function () {
    var e = emailNow();
    var to = b.getAttribute("data-go");
    var inp = panels[to].querySelector("input[type=email]");
    if (inp && e) inp.value = e;
    show(to);
  });
});

/* The code panel: `kind` is "email" (sign in), "signup" (confirm a new
   account) or "recovery" (reset the password, with the new one alongside). */
function askForCode(kind, email) {
  pending = { kind: kind, email: email };
  panels.code.reset();
  var resetting = kind === "recovery";
  document.getElementById("newpass-fields").hidden = !resetting;
  panels.code.password.required = resetting;
  panels.code.confirm.required = resetting;
  document.getElementById("code-submit").textContent = resetting ? "Save new password" : "Continue";
  show("code",
    resetting ? "Choose a new password" : kind === "signup" ? "Confirm your email" : "Enter your code",
    "We have sent a six-digit code to " + email + ". It is valid for one hour.");
}

async function sendCode(kind, email) {
  if (kind === "recovery") await Gem.auth.sendReset(email, new URL("/login/?reset=1", location.href).href);
  else if (kind === "signup") await Gem.auth.resendSignup(email);
  else await Gem.auth.sendCode(email);
}

function busy(form, on) {
  var b = form.querySelector("[type=submit]");
  if (b) b.disabled = on;
}

panels.email.addEventListener("submit", async function (e) {
  e.preventDefault();
  var email = this.email.value.trim();
  busy(this, true);
  try { await sendCode("email", email); askForCode("email", email); }
  catch (err) { say(err.message || "Could not send the code. Please try again.", false); }
  finally { busy(this, false); }
});

panels.code.addEventListener("submit", async function (e) {
  e.preventDefault();
  var f = this;
  var code = f.code.value.trim();
  if (pending.kind === "recovery" && f.password.value !== f.confirm.value) {
    say("The two passwords do not match.", false);
    return;
  }
  busy(f, true);
  try {
    await Gem.auth.verifyCode(pending.email, code, pending.kind);
    if (pending.kind === "recovery") {
      await Gem.auth.setPassword(f.password.value);
      say("Your password is saved.", true);
    }
    done();
  } catch (err) {
    say(/expired|invalid/i.test(err.message || "") ? "That code is not right, or has expired. Check it, or send a new one." : (err.message || "That did not work."), false);
    busy(f, false);
  }
});

document.getElementById("resend-btn").addEventListener("click", async function () {
  try { await sendCode(pending.kind, pending.email); say("A new code is on its way.", true); }
  catch (err) { say(err.message || "Please wait a minute before asking for another code.", false); }
});

panels.password.addEventListener("submit", async function (e) {
  e.preventDefault();
  busy(this, true);
  try { await Gem.auth.signIn(this.email.value.trim(), this.password.value); done(); }
  catch (err) { say(err.message || "Email or password is not right.", false); busy(this, false); }
});

panels.signup.addEventListener("submit", async function (e) {
  e.preventDefault();
  var f = this;
  var email = f.email.value.trim();
  busy(f, true);
  try {
    await Gem.auth.signUp(email, f.password.value, f.name.value.trim());
    var s = await Gem.auth.getSession();
    if (s) done(); else askForCode("signup", email);
  } catch (err) { say(err.message || "Could not create the account.", false); }
  finally { busy(f, false); }
});

panels.forgot.addEventListener("submit", async function (e) {
  e.preventDefault();
  var email = this.email.value.trim();
  busy(this, true);
  try { await sendCode("recovery", email); askForCode("recovery", email); }
  catch (err) { say(err.message || "Could not send the code. Please try again.", false); }
  finally { busy(this, false); }
});

panels.newpass.addEventListener("submit", async function (e) {
  e.preventDefault();
  var f = this;
  if (f.password.value !== f.confirm.value) { say("The two passwords do not match.", false); return; }
  busy(f, true);
  try { await Gem.auth.setPassword(f.password.value); say("Your password is saved.", true); setTimeout(done, 900); }
  catch (err) { say(err.message || "Could not save the password.", false); busy(f, false); }
});

document.getElementById("google-btn").addEventListener("click", async function (e) {
  e.currentTarget.disabled = true;
  try { await Gem.auth.signInWithGoogle(new URL(next, location.href).href); }
  catch (err) { say(err.message || "Google sign-in is unavailable.", false); e.currentTarget.disabled = false; }
});

(async function () {
  var s = await Gem.auth.getSession();
  if (GemShell.qs("reset") === "1") {
    if (s) show("newpass"); else show("forgot");
    return;
  }
  if (s) { location.replace(next); return; }
  show(GemShell.qs("mode") === "signup" ? "signup" : "email");
})();
</script>
<script src="../js/analytics.js" defer></script>
</body>
</html>
