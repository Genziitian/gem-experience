<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Gem Experience</title>
<meta name="description" content="Search High Jewellery, Fine Jewellery, stories, the journal and answers to common questions at Gem Experience.">
<!-- Result pages are thin and endless; the pieces they point to are what
     should be indexed. -->
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/site-nav.css">
<link rel="stylesheet" href="../css/mini-cart.css">
<link rel="stylesheet" href="../css/gift-note.css">
<link rel="stylesheet" href="../css/search.css">
</head>
<body class="pg">
<div class="pg-wrap">
  <div id="pg-header"></div>
  <main class="pg-main">
    <div class="srch">
      <form class="srch-form" id="srch-form" role="search" action="./" method="get">
        <label class="sr-only" for="srch-q">Search Gem Experience</label>
        <svg class="srch-icon" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="0.9" aria-hidden="true">
          <circle cx="9.16" cy="9.16" r="5.83"></circle><path d="M13.33 13.33 16.67 16.67"></path>
        </svg>
        <input class="srch-input" id="srch-q" name="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search pieces, stones, stories…" enterkeyhint="search">
        <button class="srch-clear" id="srch-clear" type="button" aria-label="Clear search" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </form>

      <p class="srch-status" id="srch-status" role="status" aria-live="polite"></p>
      <div class="pg-tabs srch-tabs" id="srch-tabs" role="tablist" aria-label="Filter results" hidden></div>
      <div id="srch-results"></div>
    </div>
  </main>
  <div id="pg-footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/gem.js"></script>
<script src="../js/site-footer.js"></script>
<script src="../js/site-content.js"></script>
<script src="../js/site-nav.js"></script>
<script src="../js/mini-cart.js"></script>
<script src="../js/gift-note.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/markdown.js"></script>
<script src="../js/faqs.js"></script>
<script src="../js/blog.js"></script>
<script src="../high-jewellery/data.js"></script>
<script src="../high-jewellery/stories.js"></script>
<script src="../fine-jewellery/data.js"></script>
<script src="app.js"></script>
<script src="../js/analytics.js" defer></script>
</body>
</html>
