<!-- ============================================================ hero -->
<section class="hero">

  <header class="hdr" id="hdr">
    <button class="icon-btn hdr-menu" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-haspopup="dialog">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <path d="M4 8h16M4 16h16"></path>
      </svg>
    </button>

    <h1 class="hdr-brand"><a href="./">Gem Experience</a></h1>

    <div class="hdr-icons">
      <a class="icon-btn" href="search/" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="0.833" aria-hidden="true">
          <circle cx="9.16" cy="9.16" r="5.83"></circle><path d="M13.33 13.33 16.67 16.67"></path>
        </svg>
      </a>
      <a class="icon-btn" href="login/" aria-label="Account">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="0.833" aria-hidden="true">
          <circle cx="10" cy="6.67" r="3.33"></circle><path d="M4.17 17.5c0-3.22 2.61-5.83 5.83-5.83s5.83 2.61 5.83 5.83"></path>
        </svg>
      </a>
      <a class="icon-btn pg-cart" href="cart/" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
          <path d="M5 8h14l-1.2 12H6.2L5 8Z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
        </svg>
      </a>
    </div>
  </header>

  <div class="hero-media">
    <picture>
      <source media="(min-width: 700px)" srcset="img/home-hero-wide.webp">
      <img class="hero-img" src="img/home-hero.webp" alt="Model in white organza looking into the camera, wearing a pink spinel choker and cascading earrings." fetchpriority="high" decoding="async">
    </picture>
    <!-- the whole banner opens High Jewellery; the link below is the one
         keyboards and screen readers use, so this one stays out of their way -->
    <a class="hero-hit" href="high-jewellery/" tabindex="-1" aria-hidden="true"></a>
    <div class="hero-copy">
      <p class="hero-tagline">Nothing begins above ground</p>
      <a class="rule-link rule-link--light" href="high-jewellery/">Discover Now</a>
    </div>
  </div>
</section>

<main id="main">

  <!-- ================================================== collections -->
  <section class="collections" id="collections">
    <div class="cards">

      <article class="card">
        <img class="card-img" src="img/fine-jewellery-ring.webp" srcset="img/fine-jewellery-ring-640.webp 800w, img/fine-jewellery-ring.webp 1400w" sizes="(min-width: 700px) 34vw, 100vw" alt="A hand resting on a folded arm, wearing a wide tanzanite and diamond ring against a pale green wall." loading="lazy" decoding="async">
        <div class="card-copy">
          <h3 class="card-title">Fine Jewellery</h3>
          <a class="box-link" href="fine-jewellery/">View<span class="sr-only"> Fine Jewellery</span></a>
        </div>
      </article>

      <article class="card">
        <img class="card-img" src="img/home-high-jewellery.webp" alt="Model wearing a tanzanite, aquamarine and diamond high jewellery necklace and earrings." loading="lazy" decoding="async">
        <div class="card-copy">
          <h3 class="card-title">High Jewellery</h3>
          <a class="box-link" href="high-jewellery/">View<span class="sr-only"> High Jewellery</span></a>
        </div>
      </article>

      <article class="card">
        <img class="card-img" src="img/home-gifts.webp" alt="Hands holding an open navy case with a pair of aquamarine and diamond earrings." loading="lazy" decoding="async">
        <div class="card-copy">
          <h3 class="card-title">Gifts</h3>
          <a class="box-link" href="gifts/">View<span class="sr-only"> Gifts</span></a>
        </div>
      </article>

    </div>
  </section>

  <!-- ===================================================== film band -->
  <section class="film" aria-labelledby="film-title">
    <div class="film-band">
      <img class="film-img" src="img/home-film.webp" alt="Maasai elders gathered at dusk in northern Tanzania." loading="lazy" decoding="async">
    </div>

    <div class="film-screen" id="film-screen" hidden>
      <button class="film-close" id="film-close" type="button" aria-label="Close the film">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
          <path d="M5 5l14 14M19 5 5 19"></path>
        </svg>
      </button>
    </div>

    <div class="film-copy">
      <h2 class="display" id="film-title">Discover the<br>Tanzania Universe</h2>
      <button class="play" id="play-btn" type="button" aria-label="Play the Tanzania Universe film">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5l11 7-11 7V5Z"></path>
        </svg>
      </button>
    </div>
  </section>

</main>
