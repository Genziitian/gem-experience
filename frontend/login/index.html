<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Gem Experience</title>
<meta name="description" content="Sign in to your Gem Experience account to follow enquiries and selections.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/site-nav.css">
<link rel="stylesheet" href="../css/mini-cart.css">
<link rel="stylesheet" href="../css/gift-note.css" media="print" onload="this.media='all'">
<!-- seo -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex, follow">
<meta property="og:site_name" content="Gem Experience">
<meta property="og:type" content="website">
<meta property="og:title" content="Sign in">
<meta property="og:description" content="Sign in to your Gem Experience account to follow enquiries and selections.">
<meta property="og:url" content="https://gem-experience.com/login/">
<meta property="og:image" content="https://gem-experience.com/img/home-hero-wide.webp">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sign in">
<meta name="twitter:description" content="Sign in to your Gem Experience account to follow enquiries and selections.">
<meta name="twitter:image" content="https://gem-experience.com/img/home-hero-wide.webp">
<link rel="alternate" type="text/plain" title="LLM summary" href="https://gem-experience.com/llms.txt">
<!-- /seo -->
</head>
<body class="pg">
<div class="pg-wrap">
  <div id="pg-header"></div>

  <main class="auth">
    <aside class="auth-media" role="img" aria-label="Aquamarine and diamond high jewellery worn against black.">
      <div class="auth-media-copy">
        <span class="pg-kicker">Gem Experience</span>
        <p class="auth-media-line">Nothing begins above ground</p>
      </div>
    </aside>

    <section class="auth-panel">
      <div class="auth-card">
        <span class="pg-kicker">Client account</span>
        <h1 class="pg-title" id="page-title">Sign in</h1>
        <p class="pg-lede" id="page-lede">Follow your orders, quotations and appointments in one place.</p>

        <button class="auth-google" type="button" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62Z"></path>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.03-3.71H.96v2.34A9 9 0 0 0 9 18Z"></path>
            <path fill="#FBBC05" d="M3.97 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3.01-2.33Z"></path>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.67 5.16 6.66 3.58 9 3.58Z"></path>
          </svg>
          <span id="google-label">Continue with Google</span>
        </button>

        <div class="auth-or"><span>or</span></div>

        <p class="pg-toast" id="toast" hidden></p>

        <form class="pg-form auth-form" id="auth-form">
          <label id="name-field" hidden>Full name<input name="name" autocomplete="name"></label>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label>Password<input name="password" type="password" required autocomplete="current-password" minlength="6"></label>
          <button class="pg-btn" type="submit" id="submit-btn">Sign in</button>
          <p class="auth-alt" id="alt-line">
            <button type="button" id="code-btn">Email me a sign-in code</button>
            <span aria-hidden="true">·</span>
            <button type="button" id="forgot-btn">Forgot password?</button>
          </p>
        </form>

        <!-- Sign in with a code: the email first, then the six digits we send. -->
        <form class="pg-form auth-form" id="code-form" hidden>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <label id="code-field" hidden>Sign-in code
            <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" placeholder="6-digit code">
          </label>
          <button class="pg-btn" type="submit" id="code-submit">Email me a code</button>
          <p class="auth-alt">
            <button type="button" class="js-back">Sign in with a password</button>
            <span aria-hidden="true" id="resend-sep" hidden>·</span>
            <button type="button" id="resend-btn" hidden>Send a new code</button>
          </p>
        </form>

        <!-- Forgot password: a link to set a new one. -->
        <form class="pg-form auth-form" id="forgot-form" hidden>
          <label>Email<input name="email" type="email" required autocomplete="email"></label>
          <button class="pg-btn" type="submit" id="forgot-submit">Email me a reset link</button>
          <p class="auth-alt"><button type="button" class="js-back">Back to sign in</button></p>
        </form>

        <!-- Arrived from the reset link: choose the new password. -->
        <form class="pg-form auth-form" id="reset-form" hidden>
          <label>New password<input name="password" type="password" required autocomplete="new-password" minlength="8"></label>
          <label>Confirm new password<input name="confirm" type="password" required autocomplete="new-password" minlength="8"></label>
          <button class="pg-btn" type="submit" id="reset-submit">Save new password</button>
        </form>

        <p class="pg-auth-switch" id="switch-line">
          New here? <button type="button" id="toggle-mode">Create an account</button>
        </p>

        <p class="auth-fine">
          By continuing you agree to our <a href="../legal/#terms">Terms</a> and
          <a href="../legal/#privacy">Privacy Policy</a>.
        </p>
      </div>
    </section>
  </main>
  <div id="pg-footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/gem.js"></script>
<script src="../js/site-footer.js"></script>
<script src="../js/site-content.js"></script>
<script src="../js/site-nav.js"></script>
<script src="../js/mini-cart.js"></script>
<script src="../js/gift-note.js"></script>
<script src="../js/shell.js"></script>
<script>
GemShell.mount();

/* Where to land after signing in — checkout sends people here mid-enquiry. */
var next = GemShell.qs("next") || "../account/";
var mode = "signin";

var nameField = document.getElementById("name-field");
var title = document.getElementById("page-title");
var lede = document.getElementById("page-lede");
var submitBtn = document.getElementById("submit-btn");
var switchLine = document.getElementById("switch-line");
var googleLabel = document.getElementById("google-label");
var toast = document.getElementById("toast");

var resetting = GemShell.qs("reset") === "1";
var forms = {
  password: document.getElementById("auth-form"),
  code: document.getElementById("code-form"),
  forgot: document.getElementById("forgot-form"),
  reset: document.getElementById("reset-form")
};
var googleBtn = document.getElementById("google-btn");
var orLine = document.querySelector(".auth-or");

/* One panel at a time: the password form (sign in / create account), the
   sign-in code, the forgotten password, or the new password after a reset. */
function show(which, heading, line) {
  Object.keys(forms).forEach(function (k) { forms[k].hidden = k !== which; });
  var withGoogle = which === "password";
  googleBtn.hidden = !withGoogle;
  orLine.hidden = !withGoogle;
  switchLine.hidden = !withGoogle;
  toast.hidden = true;
  if (heading) title.textContent = heading;
  if (line) lede.textContent = line;
  var first = forms[which].querySelector("input:not([type=hidden])");
  if (first && which !== "password") first.focus();
}

(async function () {
  var s = await Gem.auth.getSession();
  if (resetting) {
    if (s) show("reset", "Choose a new password", "Set the password you will use from now on.");
    else {
      show("forgot", "Reset your password", "That link has expired or was opened in another browser. Ask for a new one here.");
    }
    return;
  }
  if (s) location.replace(next);
})();

function setMode(nextMode) {
  mode = nextMode;
  var signingIn = mode === "signin";
  nameField.hidden = signingIn;
  title.textContent = signingIn ? "Sign in" : "Create account";
  lede.textContent = signingIn
    ? "Follow your orders, quotations and appointments in one place."
    : "An account keeps your selections and enquiries close to the atelier.";
  submitBtn.textContent = signingIn ? "Sign in" : "Create account";
  googleLabel.textContent = signingIn ? "Continue with Google" : "Sign up with Google";
  switchLine.innerHTML = signingIn
    ? 'New here? <button type="button" id="toggle-mode">Create an account</button>'
    : 'Already registered? <button type="button" id="toggle-mode">Sign in</button>';
  document.getElementById("alt-line").hidden = !signingIn;
  document.querySelector("[name=password]").setAttribute(
    "autocomplete", signingIn ? "current-password" : "new-password"
  );
  wireToggle();
}

function wireToggle() {
  document.getElementById("toggle-mode").addEventListener("click", function () {
    setMode(mode === "signin" ? "signup" : "signin");
  });
}

wireToggle();

document.getElementById("google-btn").addEventListener("click", async function (e) {
  e.currentTarget.disabled = true;
  try {
    await Gem.auth.signInWithGoogle(new URL(next, location.href).href);
  } catch (err) {
    GemShell.toast(toast, err.message || "Google sign-in is unavailable.", false);
    e.currentTarget.disabled = false;
  }
});

function backToSignIn() {
  setMode("signin");
  show("password", "Sign in", "Follow your orders, quotations and appointments in one place.");
}
document.querySelectorAll(".js-back").forEach(function (b) { b.addEventListener("click", backToSignIn); });

/* Carry an email already typed from one panel to the next. */
function typedEmail() {
  var v = forms.password.email.value.trim();
  return v;
}

document.getElementById("code-btn").addEventListener("click", function () {
  forms.code.email.value = typedEmail();
  document.getElementById("code-field").hidden = true;
  forms.code.code.required = false;
  document.getElementById("code-submit").textContent = "Email me a code";
  show("code", "Sign in with a code", "We will email you a six-digit code. No password needed.");
});

document.getElementById("forgot-btn").addEventListener("click", function () {
  forms.forgot.email.value = typedEmail();
  show("forgot", "Reset your password", "Enter your email and we will send you a link to choose a new password.");
});

var codeSent = false;
async function requestCode() {
  var email = forms.code.email.value.trim();
  await Gem.auth.sendCode(email);
  codeSent = true;
  document.getElementById("code-field").hidden = false;
  forms.code.code.required = true;
  document.getElementById("resend-btn").hidden = false;
  document.getElementById("resend-sep").hidden = false;
  document.getElementById("code-submit").textContent = "Sign in";
  lede.textContent = "We have sent a code to " + email + ". It is valid for one hour.";
  forms.code.code.focus();
}

forms.code.addEventListener("submit", async function (e) {
  e.preventDefault();
  var btn = document.getElementById("code-submit");
  btn.disabled = true;
  try {
    if (!codeSent) await requestCode();
    else {
      await Gem.auth.verifyCode(forms.code.email.value.trim(), forms.code.code.value.trim());
      location.href = next;
    }
  } catch (err) {
    GemShell.toast(toast, err.message || "That did not work. Please try again.", false);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("resend-btn").addEventListener("click", async function () {
  try {
    await requestCode();
    GemShell.toast(toast, "A new code is on its way.", true);
  } catch (err) {
    GemShell.toast(toast, err.message || "Could not send a new code yet. Please wait a minute.", false);
  }
});

forms.forgot.addEventListener("submit", async function (e) {
  e.preventDefault();
  var btn = document.getElementById("forgot-submit");
  btn.disabled = true;
  try {
    await Gem.auth.sendReset(forms.forgot.email.value.trim(), new URL("/login/?reset=1", location.href).href);
    GemShell.toast(toast, "If that address has an account, a reset link is on its way. Open it in this browser.", true);
  } catch (err) {
    GemShell.toast(toast, err.message || "Could not send the link. Please try again.", false);
  } finally {
    btn.disabled = false;
  }
});

forms.reset.addEventListener("submit", async function (e) {
  e.preventDefault();
  var f = e.target;
  if (f.password.value !== f.confirm.value) {
    GemShell.toast(toast, "The two passwords do not match.", false);
    return;
  }
  var btn = document.getElementById("reset-submit");
  btn.disabled = true;
  try {
    await Gem.auth.setPassword(f.password.value);
    GemShell.toast(toast, "Your password is saved. Taking you to your account…", true);
    setTimeout(function () { location.href = next; }, 1200);
  } catch (err) {
    GemShell.toast(toast, err.message || "Could not save the password.", false);
    btn.disabled = false;
  }
});

document.getElementById("auth-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  var f = e.target;
  submitBtn.disabled = true;
  try {
    if (mode === "signin") {
      await Gem.auth.signIn(f.email.value.trim(), f.password.value);
      location.href = next;
    } else {
      await Gem.auth.signUp(f.email.value.trim(), f.password.value, f.name.value.trim());
      var s = await Gem.auth.getSession();
      if (s) location.href = next;
      else GemShell.toast(toast, "Check your inbox to confirm your email, then sign in.", true);
    }
  } catch (err) {
    GemShell.toast(toast, err.message || "Authentication failed.", false);
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
<script src="../js/analytics.js" defer></script>
</body>
</html>
