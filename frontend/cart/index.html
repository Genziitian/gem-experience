<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart — Gem Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/site-nav.css">
<link rel="stylesheet" href="../css/mini-cart.css">
</head>
<body class="pg">
<div class="pg-wrap">
  <div id="pg-header"></div>
  <header class="pg-hero">
    <span class="pg-kicker">Selection</span>
    <h1 class="pg-title">Your cart</h1>
    <p class="pg-lede">Pieces here are held as a private selection. High Jewellery continues by quotation or viewing.</p>
  </header>
  <main class="pg-main">
    <div class="pg-grid" id="cart-root"></div>
  </main>
  <div id="pg-footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/gem.js"></script>
<script src="../js/site-footer.js"></script>
<script src="../js/site-content.js"></script>
<script src="../js/site-nav.js"></script>
<script src="../js/mini-cart.js"></script>
<script src="../js/shell.js"></script>
<script>
GemShell.mount();

function render() {
  var items = Gem.cart.read();
  var root = document.getElementById("cart-root");
  if (!items.length) {
    root.innerHTML =
      '<div class="pg-cart-empty">' +
        "<p>Your selection is empty.</p>" +
        '<a class="pg-btn" href="../high-jewellery/">Explore High Jewellery</a>' +
      "</div>";
    return;
  }

  /* The gift note is written on /gifts/ and kept locally. The cart is where
     somebody is most likely to remember it, so it is surfaced here rather than
     left to be discovered. */
  function giftNote() {
    try {
      var g = JSON.parse(localStorage.getItem("gem_gift_note_v1") || "null");
      return g && (g.to || g.message) ? g : null;
    } catch (e) { return null; }
  }

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function giftLabel() {
    var g = giftNote();
    return g ? "Edit the gift message" : "Add a gift message";
  }

  function giftBlock() {
    var g = giftNote();
    if (!g) {
      return '<p class="pg-note pg-gift-hint">Sending this as a gift? A card is written by hand and set inside the box \u2014 no charge.</p>';
    }
    return (
      '<div class="pg-gift-set">' +
        '<span class="pg-gift-set-k">Gift card</span>' +
        (g.to ? "<p><strong>For " + esc(g.to) + "</strong></p>" : "") +
        (g.message ? "<p><em>" + esc(g.message) + "</em></p>" : "") +
        (g.from ? "<p>\u2014 " + esc(g.from) + "</p>" : "") +
        (g.letter ? '<p class="pg-gift-set-x">With a letter from the workshop.</p>' : "") +
      "</div>"
    );
  }

  var list = items.map(function (it) {
    return (
      '<article class="pg-cart-item" data-id="' + it.id + '">' +
        (it.image ? '<img src="' + it.image + '" alt="">' : '<div class="pg-cart-item-ph"></div>') +
        "<div>" +
          "<h3>" + it.name + "</h3>" +
          "<p>" + (it.materials || "Price on enquiry") + "</p>" +
          '<div class="pg-qty">' +
            '<button type="button" data-act="dec" aria-label="Decrease">−</button>' +
            "<span>" + (it.qty || 1) + "</span>" +
            '<button type="button" data-act="inc" aria-label="Increase">+</button>' +
          "</div>" +
        "</div>" +
        '<button type="button" class="pg-btn pg-btn--ghost pg-btn--sm" data-act="rm">Remove</button>' +
      "</article>"
    );
  }).join("");

  root.innerHTML =
    '<div><div class="pg-cart-list">' + list + "</div></div>" +
    '<aside class="pg-panel pg-summary">' +
      "<h2>Summary</h2>" +
      "<p class=\"pg-note\">Most High Jewellery pieces are quoted privately — checkout opens an enquiry with our advisors.</p>" +
      "<dl><div class=\"pg-total\"><span>Pieces</span><span>" + items.length + "</span></div></dl>" +
      giftBlock() +
      '<div class="pg-actions pg-actions--col">' +
        '<a class="pg-btn" href="../checkout/">Proceed to checkout</a>' +
        /* "Request quotation instead" sent people out of a flow that already
           ends in a quotation, so it read as a second, better option and lost
           the selection on the way. Personalisation takes its place: it is the
           thing somebody actually wants from a cart full of gifts. */
        '<a class="pg-btn pg-btn--ghost" href="../gifts/#personalise">' + giftLabel() + '</a>' +
      "</div>" +
    "</aside>";

  root.querySelectorAll(".pg-cart-item").forEach(function (row) {
    var id = row.getAttribute("data-id");
    row.addEventListener("click", function (e) {
      var act = e.target.getAttribute("data-act");
      if (!act) return;
      var item = Gem.cart.read().find(function (x) { return x.id === id; });
      if (!item) return;
      if (act === "inc") Gem.cart.updateQty(id, (item.qty || 1) + 1);
      if (act === "dec") Gem.cart.updateQty(id, Math.max(1, (item.qty || 1) - 1));
      if (act === "rm") Gem.cart.remove(id);
      render();
    });
  });
}

render();
window.addEventListener("gem:cart", render);
</script>
<script src="../js/analytics.js" defer></script>
</body>
</html>
