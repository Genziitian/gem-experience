# Additions for /etc/nginx/sites-available/gem-experience (the 443 server block).
# Found in the 2026-10-17 audit: the site is served over HTTP/1.1 and every
# response says Cache-Control: no-cache, which Lighthouse charges ~1.7-2.5s of
# mobile load for. Gzip is already on and stays as it is.
#
# Apply on the VPS:
#   1. change   listen 443 ssl;            ->  listen 443 ssl http2;
#      (and the [::]:443 line the same way)
#   2. paste the blocks below inside the 443 server { } block, above the
#      existing `location /` block
#   3. nginx -t && systemctl reload nginx

# Security headers (none are sent today).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Photographs, film, fonts and icons change by replacing the file under a new
# name or rarely at all: cache for 30 days.
location ~* \.(?:webp|jpe?g|png|gif|svg|ico|mp4|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Scripts and styles are not fingerprinted, so a short cache that revalidates:
# a deploy shows up within the hour, repeat views skip the download.
location ~* \.(?:css|js)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
# HTML keeps no-cache, so a deploy is seen on the next page view.
